name: Deploy static content to Pages

on:
  # 当代码推送到 main 分支时触发
  push:
    branches: ['main']

  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 赋予脚本修改 GitHub Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 防止并发冲突
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (拉取代码)
        uses: actions/checkout@v4

      - name: Set up Node (安装环境)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies (安装依赖)
        run: npm ci

      - name: Build (打包项目)
        run: npm run build

      - name: Setup Pages (设置页面)
        uses: actions/configure-pages@v4

      - name: Upload artifact (上传文件)
        uses: actions/upload-pages-artifact@v3
        with:
          # 注意：Vite 默认打包输出文件夹是 dist
          path: './dist'

      - name: Deploy to GitHub Pages (发布!)
        id: deployment
        uses: actions/deploy-pages@v4