# 超元链接 · 信令 Worker
#
# 部署：
#   npx wrangler deploy
#
# 本地调试（可选）：
#   npx wrangler dev
#
# 部署完会得到一个 https://sbr-signaling.<你的子域>.workers.dev
# 把游戏里的小写 wss:// 版本填进去即可：
#   wss://sbr-signaling.<你的子域>.workers.dev/ws

name = "sbr-signaling"
main = "workers/signaling.js"
compatibility_date = "2024-09-01"

# 房间号 → Durable Object 实例
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite 后端的 Durable Object，属于 Workers 免费计划
# ⚠️ 如果你的账号提示不支持 new_sqlite_classes，把它改成 new_classes 再试
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
